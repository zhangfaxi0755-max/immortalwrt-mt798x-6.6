name: Build Qubes-Base-Router

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检查并同步代码
        uses: actions/checkout@v4

      - name: 安装编译环境
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev

      - name: 彻底清理并更新源
        run: |
          # 强制删除 feeds.conf.default 里的 passwall 引用
          sed -i '/passwall/d' feeds.conf.default
          # 更新基础源
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 注入配置并补齐
        run: |
          if [ -f .config ]; then
            make defconfig
          else
            echo "Error: .config not found"
            exit 1
          fi

      - name: 下载源码
        run: make download -j8

      - name: 编译地基固件
        run: make -j$(nproc) || make -j1 V=s

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Qubes_Base_N60Pro
          path: bin/targets/mediatek/filogic/*.bin
