name: Build Qubes-Base-Router

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检查并同步代码
        uses: actions/checkout@v4

      - name: 安装编译环境
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev

      - name: 更新基础源
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 注入 .config 配置
        run: |
          if [ -f .config ]; then
            echo "正在应用极简安全配置..."
            # 补齐依赖并生成最终配置
            make defconfig
          else
            echo "错误: 未找到 .config 文件!"
            exit 1
          fi

      - name: 下载源码包
        run: make download -j8

      - name: 编译极简地基固件
        run: |
          echo "正在为你编译 N60 Pro 极简底座，预计 40 分钟完成..."
          make -j$(nproc) || make -j1 V=s

      - name: 整理并上传
        uses: actions/upload-artifact@v4
        with:
          name: Qubes_Base_N60Pro
          path: bin/targets/mediatek/filogic/*.bin
